<!DOCTYPE html>
<html>
<head>
  <title>ADHD Support App</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      padding: 20px;
      color: #333;
    }

    h1, h2 {
      text-align: center;
    }

    .box {
      background: #ffffffcc;
      backdrop-filter: blur(10px);
      padding: 20px;
      margin: 15px auto;
      border-radius: 20px;
      max-width: 400px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    label {
      display: block;
      padding: 8px;
      border-radius: 10px;
      margin: 5px 0;
      background: #f9fafb;
      cursor: pointer;
      transition: 0.2s;
    }

    label:hover {
      background: #e0f2fe;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 12px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
    }

    small {
      color: #555;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="box">
  <h1>Welcome</h1>
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>

  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
</div>

<!-- PROBLEMS -->
<div id="problemScreen" class="box hidden">
  <h2>What are you struggling with?</h2>

  <label><input type="checkbox" value="focus"> 🎯 Can't focus</label>
  <label><input type="checkbox" value="procrastination"> ⏳ Procrastination</label>
  <label><input type="checkbox" value="forgetfulness"> 🧠 Forget tasks</label>
  <label><input type="checkbox" value="concentration"> 🔍 Poor concentration</label>

  <button onclick="saveProblems()">Get Techniques</button>
</div>

<!-- TECHNIQUES -->
<div id="techniqueScreen" class="box hidden">
  <h2>Recommended Techniques</h2>
  <ul id="techniqueList"></ul>

  <button onclick="goToProgress()">View Progress</button>
</div>

<!-- PROGRESS -->
<div id="progressScreen" class="box hidden">
  <h2>Your Progress</h2>

  <p id="pointsDisplay"></p>
  <p id="tasksDisplay"></p>
  <p id="streakDisplay"></p>

  <button onclick="logout()">Logout</button>
</div>

<script>
let userData = { problems: [] };

const solutions = {
  focus: [
    {
      title: "Pomodoro Technique",
      desc: "Work for 25 minutes, then take a 5-minute break. This helps your brain stay fresh."
    },
    {
      title: "Noise-canceling headphones",
      desc: "Reduce distractions by blocking external sounds so you can focus better."
    }
  ],

  procrastination: [
    {
      title: "5-minute rule",
      desc: "Start the task for just 5 minutes. Starting is the hardest part."
    },
    {
      title: "Break tasks into small steps",
      desc: "Small steps feel easier and reduce overwhelm."
    }
  ],

  forgetfulness: [
    {
      title: "Write tasks immediately",
      desc: "Capture tasks right away so you don’t forget."
    },
    {
      title: "Use reminders",
      desc: "Set alarms so you don’t rely only on memory."
    }
  ],

  concentration: [
    {
      title: "Single-tasking",
      desc: "Focus on one task at a time instead of multitasking."
    },
    {
      title: "Environment control",
      desc: "Remove distractions like your phone or clutter."
    },
    {
      title: "Deep work blocks",
      desc: "Work in longer focused sessions (45–60 minutes)."
    }
  ]
};

function showScreen(id) {
  document.querySelectorAll("div").forEach(d => d.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function saveProblems() {
  const selected = [...document.querySelectorAll("input:checked")]
    .map(cb => cb.value);

  userData.problems = selected;
  showTechniques();
}

function showScreen(id) {
  // Fix to prevent target screen from accidentally hiding itself
  document.querySelectorAll(".box").forEach(d => d.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showTechniques() {
  const list = document.getElementById("techniqueList");
  list.innerHTML = "";

  userData.problems.forEach(p => {
    solutions[p].forEach(t => {
      const li = document.createElement("li");

      li.innerHTML = `
        <strong>${t.title}</strong><br>
        <small>${t.desc}</small><br>
        <button onclick="completeTask(this)">✨ Done</button>
      `;

      list.appendChild(li);
    });
  });

  showScreen("techniqueScreen");
}

let points = 0;
let tasks = 0;

// --- STREAK LOGIC STARTS HERE ---
function completeTask(btn) {
  points += 10;
  tasks += 1;

  btn.innerText = "✅ Completed";
  btn.disabled = true;
  btn.parentElement.style.background = "#dcfce7";

  updateStreak();
}

function updateStreak() {
  const today = new Date().toDateString();
  const lastCompletedDate = localStorage.getItem("lastCompletedDate");
  let currentStreak = parseInt(localStorage.getItem("currentStreak")) || 0;

  if (!lastCompletedDate) {
    // First task ever completed
    currentStreak = 1;
  } else {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayString = yesterday.toDateString();

    if (lastCompletedDate === yesterdayString) {
      // Last completed task was yesterday, increment streak
      currentStreak += 1;
    } else if (lastCompletedDate === today) {
      // Already completed a task today, keep streak the same
    } else {
      // Missed a day or more, reset streak to 1
      currentStreak = 1;
    }
  }

  // Save changes back to localStorage
  localStorage.setItem("lastCompletedDate", today);
  localStorage.setItem("currentStreak", currentStreak);
}

function checkStreakValidity() {
  const lastCompletedDate = localStorage.getItem("lastCompletedDate");
  let currentStreak = parseInt(localStorage.getItem("currentStreak")) || 0;

  if (lastCompletedDate) {
    const today = new Date().toDateString();
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayString = yesterday.toDateString();

    // If the last completion wasn't today OR yesterday, the streak is broken (reset to 0)
    if (lastCompletedDate !== today && lastCompletedDate !== yesterdayString) {
      currentStreak = 0;
      localStorage.setItem("currentStreak", currentStreak);
    }
  }
  return currentStreak;
}

function goToProgress() {
  // Check if the user broke their streak before rendering the text
  const currentStreak = checkStreakValidity();

  document.getElementById("pointsDisplay").innerText = "⭐ Points: " + points;
  document.getElementById("tasksDisplay").innerText = "✅ Tasks completed: " + tasks;
  document.getElementById("streakDisplay").innerText = "🔥 Streak: " + currentStreak + " days";

  showScreen("progressScreen");
}
// --- STREAK LOGIC ENDS HERE ---

function login() { showScreen("problemScreen"); }
function signup() { showScreen("problemScreen"); }
function logout() { location.reload(); }
</script>

</body>
</html>
